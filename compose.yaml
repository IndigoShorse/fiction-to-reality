services:
  api:
    build:
      context: ./Backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      # API доступен только на VPS; публичный доступ добавит Nginx.
      - "127.0.0.1:8000:8000"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    ports:
      # Доступ для администрирования только через SSH-туннель на VPS.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
